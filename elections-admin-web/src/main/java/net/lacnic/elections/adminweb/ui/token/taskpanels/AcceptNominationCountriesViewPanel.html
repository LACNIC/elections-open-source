<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div class="card mb-3">
		<div class="card-header">
			<h4 wicket:id="cardTitle" class="card-title" data-testid="cardTitle"><wicket:message key="acceptNominationCountriesTitle" /></h4>
		</div>
		<div class="card-body">
			<div wicket:id="restrictedCountriesAlert" class="alert alert-warning mb-3" data-testid="restrictedCountriesAlert"></div>

			<div class="mb-3">
				<h5 class="mb-3" data-testid="v_nculos_declarados_por_pa_s"><wicket:message key="acceptNominationCountriesDeclaredByCountryTitle" /></h5>
				<div wicket:id="countriesTableContainer" class="table-responsive" data-testid="countriesTableContainer">
					<p wicket:id="noCountriesLabel" class="text-muted mb-3" data-testid="noCountriesLabel"></p>
					<table class="table table-hover align-middle mb-0">
						<thead class="bg-light bg-opacity-25 thead-sm">
							<tr class="text-uppercase fs-xxs">
								<th class="text-start align-top"><wicket:message key="acceptNominationCountriesTableLinkHeader" /></th>
								<th wicket:id="countryHeaders" class="text-start align-top" data-testid="countryHeaders">
									<span wicket:id="countryHeaderLabel" data-testid="countryHeaderLabel"></span>
									<span wicket:id="representedCountryBadge" class="badge badge-label badge-soft-primary ms-2" tabindex="0" role="button"
										data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="top" data-bs-content="" data-testid="representedCountryBadge">
										<i class="ti ti-flag fs-5"></i>
									</span>
								</th>
							</tr>
						</thead>
						<tbody>
							<tr wicket:id="questionRows" data-testid="questionRows">
								<td wicket:id="questionLabel" data-testid="questionLabel"></td>
								<wicket:container wicket:id="answerCells" data-testid="answerCells">
									<td wicket:id="answerCell" data-testid="answerCell"></td>
								</wicket:container>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

		</div>
	</div>
</wicket:panel>
