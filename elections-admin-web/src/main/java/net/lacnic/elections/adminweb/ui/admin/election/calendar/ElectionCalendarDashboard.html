<wicket:extend>
	<div class="row">
		<div wicket:id="feedback" data-testid="feedback"></div>
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 class="card-title mb-0" data-testid="electionManagementCalendarTitle"><wicket:message key="electionManagementCalendarTitle">Calendario</wicket:message></h5>
				</div>
				<div class="card-body">
					<div class="ins-wizard">
						<div wicket:id="tabsPanel" data-testid="tabsPanel"></div>
						<div class="tab-content pt-3">
							<div class="tab-pane fade show active">
								<p class="mb-0 text-muted">Hola, soy el tab Calendario.</p>
								<div class="col-12">
									<hr class="my-3">
								</div>
								<div class="d-flex justify-content-between mt-4">
									<button wicket:id="back" data-testid="back" type="button" class="btn btn-light">
										<wicket:message key="censusManagementBack" />
									</button>
									<button wicket:id="markDoneNext" data-testid="markDoneNext" type="button" class="btn btn-primary">
										<wicket:message key="electionManagementMarkCompleteNext" />
									</button>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
