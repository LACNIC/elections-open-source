<wicket:extend>
	<div class="row">
		<div wicket:id="feedback" data-testid="feedback"></div>
		<div class="col-lg-12">
			<div class="card float-e-margins">
				<div class="card-header">
					<h5 class="mb-0" data-testid="preElectionReportsTitle">
						<wicket:message key="preElectionReportsTitle">Reportes pre electorales</wicket:message>
						<span class="text-success" wicket:id="electionTitle" data-testid="electionTitle"></span>
					</h5>
				</div>
				<div class="card-body">
					<div wicket:id="preElectionReportsPanel" data-testid="preElectionReportsPanel"></div>
				</div>
			</div>
		</div>
		<div class="col-lg-12">
			<div class="text-center mt-2">
				<button wicket:id="back" data-testid="back" type="button" class="btn btn-light">
					<wicket:message key="confElecBtnBack" />
				</button>
			</div>
		</div>
	</div>
</wicket:extend>
