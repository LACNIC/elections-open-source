<wicket:panel>
	<form wicket:id="nominationForm" data-testid="public-nomination-form">
		<div class="row g-4 align-items-center">
			<div class="col-sm-7 border-end border-dashed">
				<div class="p-2">
					<div class="d-flex align-items-center gap-2 mb-3">
						<h4 class="mb-0 fw-bold text-uppercase" data-testid="publicNominationPersonalDataTitle"><wicket:message key="publicNominationPersonalDataTitle">Ingrese sus datos personales</wicket:message></h4>
						<span class="badge badge-label badge-soft-secondary rounded-pill" tabindex="0" role="button"
							data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="top"
							data-testid="publicNominationPersonalDataHelp"
							wicket:message="title:publicNominationPersonalDataPopoverTitle,data-bs-content:publicNominationPersonalDataPopoverContent">
							<i class="ti ti-help-circle"></i>
						</span>
					</div>

					<div class="mb-3">
						<label for="nominatorName" class="form-label"><wicket:message key="publicNominationNominatorNameLabel" /> <span class="text-danger">*</span></label>
						<input wicket:id="nominatorName" id="nominatorName" type="text" class="form-control"
							wicket:message="placeholder:publicNominationNominatorNamePlaceholder" data-testid="publicNominationNominatorName">
					</div>

					<div class="mb-4">
						<label for="nominatorEmail" class="form-label"><wicket:message key="publicNominationNominatorEmailLabel" /> <span class="text-danger">*</span></label>
						<input wicket:id="nominatorEmail" id="nominatorEmail" type="email" class="form-control"
							wicket:message="placeholder:publicNominationNominatorEmailPlaceholder" data-testid="publicNominationNominatorEmail">
					</div>

					<div class="row g-3 mb-4">
						<div class="col-md-4">
							<label for="organizationCountry" class="form-label"><wicket:message key="publicNominationOrganizationCountryLabel" /> <span class="text-danger">*</span></label>
							<select wicket:id="organizationCountry" id="organizationCountry" class="form-select" data-testid="publicNominationOrganizationCountry"></select>
						</div>

						<div class="col-md-8">
							<label for="organizationName" class="form-label"><wicket:message key="publicNominationOrganizationNameLabel" /> <span class="text-danger">*</span></label>
							<input wicket:id="organizationName" id="organizationName" type="text" class="form-control"
								wicket:message="placeholder:publicNominationOrganizationNamePlaceholder" data-testid="publicNominationOrganizationName">
						</div>
					</div>

					<label class="form-label" data-testid="publicNominationTargetSectionTitle"><wicket:message key="publicNominationTargetQuestionLabel">Tipo de postulación</wicket:message> <span class="text-danger">*</span></label>

					<div wicket:id="nominationTargetGroup" class="mb-4" data-testid="publicNominationTargetGroup">
						<div class="vstack gap-2">
							<div class="form-check">
								<input wicket:id="selfNominationOption" id="selfNominationOption" type="radio" class="form-check-input" data-testid="publicNominationSelfOption">
								<label for="selfNominationOption" class="form-check-label"><wicket:message key="publicNominationTargetSelfOption">Me estoy postulando</wicket:message></label>
							</div>
							<div class="form-check">
								<input wicket:id="thirdPartyNominationOption" id="thirdPartyNominationOption" type="radio" class="form-check-input" data-testid="publicNominationThirdPartyOption">
								<label for="thirdPartyNominationOption" class="form-check-label"><wicket:message key="publicNominationTargetThirdPartyOption">Postularé a un tercero</wicket:message></label>
							</div>
						</div>
					</div>

					<div wicket:id="nominationDetailsContainer" class="mt-4" data-testid="publicNominationDetailsContainer">
						<hr class="my-4">

						<div wicket:id="nominationThirdPartyHeader">
							<div class="d-flex align-items-center gap-2 mb-3">
								<h4 class="mb-0 fw-bold text-uppercase" data-testid="publicNominationDetailsTitle"><wicket:message key="publicNominationNomineeSectionTitle">Datos de la persona postulada</wicket:message></h4>
								<span class="badge badge-label badge-soft-secondary rounded-pill" tabindex="0" role="button"
									data-bs-toggle="popover" data-bs-trigger="hover focus" data-bs-placement="top"
									data-testid="publicNominationNomineeDataHelp"
									wicket:message="title:publicNominationNomineePopoverTitle,data-bs-content:publicNominationNomineePopoverContent">
									<i class="ti ti-help-circle"></i>
								</span>
							</div>
						</div>

						<div wicket:id="nomineeIdentityContainer">
							<div class="mb-3">
								<label for="nomineeName" class="form-label"><wicket:message key="publicNominationNomineeNameLabel" /> <span class="text-danger">*</span></label>
								<input wicket:id="nomineeName" id="nomineeName" type="text" class="form-control"
									wicket:message="placeholder:nominationCandidateFullNamePlaceholder" data-testid="publicNominationNomineeName">
							</div>

							<div class="mb-3">
								<label for="nomineeEmail" class="form-label"><wicket:message key="publicNominationNomineeEmailLabel" /> <span class="text-danger">*</span></label>
								<input wicket:id="nomineeEmail" id="nomineeEmail" type="email" class="form-control"
									wicket:message="placeholder:nominationCandidateEmailPlaceholder" data-testid="publicNominationNomineeEmail">
							</div>
						</div>

						<div class="mb-3">
							<label class="form-label"><span wicket:id="nomineePhoneLabel">Teléfono</span> <span class="text-danger">*</span></label>
							<div class="row g-2">
								<div class="col-4">
									<input wicket:id="nomineePhoneCountry" type="text" class="form-control"
										wicket:message="placeholder:nominationCandidatePhoneCountryPlaceholder" data-testid="publicNominationNomineePhoneCountry">
								</div>
								<div class="col-8">
									<input wicket:id="nomineePhone" type="text" class="form-control"
										wicket:message="placeholder:nominationCandidatePhonePlaceholder" data-testid="publicNominationNomineePhone">
								</div>
							</div>
						</div>

						<div class="mb-4">
							<label class="form-label"><span wicket:id="nominationReasonLabel">Motivo de la postulación</span> <span class="text-danger">*</span></label>
							<div wicket:id="nominationReasonEditor" data-testid="publicNominationReason"></div>
						</div>
					</div>

					<hr class="my-4">

					<div class="mb-4">
						<div class="d-flex justify-content-center">
							<div class="g-recaptcha" data-sitekey="" wicket:id="reCaptcha" data-testid="publicNominationCaptcha"></div>
						</div>
					</div>

					<div class="d-flex justify-content-end align-items-center">
						<button wicket:id="submitNomination" class="btn btn-primary" type="submit" data-testid="publicNominationSubmitButton">
							<strong><wicket:message key="publicNominationSubmitButton">Enviar postulación pública</wicket:message></strong>
						</button>
					</div>
				</div>
			</div>

			<div class="col-sm-5">
				<div class="text-center" data-testid="public-nomination-process-card">
					<div class="avatar avatar-xl mx-auto">
						<span class="avatar-title bg-primary-subtle text-primary rounded-circle fw-bold">
							<i data-lucide="award" class="text-primary fs-28 fill-primary"></i>
						</span>
					</div>
					<h4 class="mt-3" data-testid="publicNominationSidebarTitle"><wicket:message key="nominationProcessTitle">Proceso de postulación</wicket:message></h4>
					<p class="text-muted mb-0" data-testid="publicNominationSidebarSubtitle"><wicket:message key="nominationProcessSubtitle">Verifica los datos antes de enviar la postulación.</wicket:message></p>
					<div wicket:id="restrictedCountriesLinkContainer" class="mt-3" data-testid="publicRestrictedCountriesLinkContainer">
						<a href="#" class="text-danger" data-bs-toggle="modal" data-bs-target="#public-restricted-countries-modal"
							data-testid="publicRestrictedCountriesLink">
							<i class="ti ti-alert-hexagon me-1"></i>
							<wicket:message key="nominationRestrictedCountriesOpenButton">Restricciones en esta elección</wicket:message>
						</a>
					</div>
				</div>
			</div>
		</div>
	</form>

	<div wicket:id="restrictedCountriesModalContainer" data-testid="publicRestrictedCountriesModalContainer">
		<div id="public-restricted-countries-modal" class="modal fade" tabindex="-1" role="dialog" aria-labelledby="public-restricted-countries-modal-label" aria-hidden="true"
			data-testid="public-restricted-countries-modal">
			<div class="modal-dialog modal-dialog-centered modal-lg" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h4 class="modal-title text-danger" id="public-restricted-countries-modal-label" data-testid="publicRestrictedCountriesModalTitle">
							<wicket:message key="nominationRestrictedCountriesModalTitle">Restricciones por país</wicket:message>
						</h4>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" data-testid="publicRestrictedCountriesModalCloseIcon"></button>
					</div>
					<div class="modal-body">
						<p class="mb-4">
							<span wicket:id="restrictedCountriesSummary" data-testid="publicRestrictedCountriesSummary"></span>
						</p>

						<div class="row g-3 justify-content-center">
							<div wicket:id="restrictedCountries" data-testid="publicRestrictedCountries" class="col-6 col-md-4 col-lg-3">
								<div class="text-center">
									<div class="d-flex align-items-center justify-content-center bg-light rounded border border-danger-subtle p-2" style="min-height: 132px;">
										<img wicket:id="countryFlag" data-testid="publicRestrictedCountryFlag" class="img-fluid rounded shadow-sm border border-danger border-3" style="max-height: 116px;">
										<div wicket:id="countryFallbackName" data-testid="publicRestrictedCountryFallbackName"
											class="d-none d-flex align-items-center justify-content-center text-center fw-semibold text-danger w-100 h-100 p-2"></div>
									</div>
									<div class="mt-2 fw-semibold" wicket:id="countryName" data-testid="publicRestrictedCountryName" data-country-label="true"></div>
								</div>
							</div>
						</div>
					</div>
					<div class="modal-footer">
						<button type="button" class="btn btn-light" data-bs-dismiss="modal" data-testid="publicRestrictedCountriesModalAcknowledgeButton">
							<wicket:message key="nominationRestrictedCountriesModalCloseButton" />
						</button>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
