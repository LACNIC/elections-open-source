<wicket:extend>
	<div wicket:id="feedback" data-testid="feedback" />
	<div class="row">
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 data-testid="commissionerEditTitle"><wicket:message key="commissionerEditTitle">Editar un comisionado del sistema</wicket:message></h5>
				</div>
				<div class="card-body">
					<form wicket:id="formCommissioner" data-testid="formCommissioner">
						<div class="row g-3 align-items-end">
							<div class="col-md-3">
								<label class="form-label" for="editCommissionerName"><wicket:message key="commissionerEditName">commissionerEditName</wicket:message></label>
								<input type="text" id="editCommissionerName" class="form-control" wicket:id="name" data-testid="name" />
									</div>
									<div class="col-md-5">
								<label class="form-label" for="editCommissionerMail"><wicket:message key="commissionerEditMail">commissionerEditMail</wicket:message></label>
								<input type="email" id="editCommissionerMail" class="form-control" wicket:id="mail" data-testid="mail" />
							</div>
							<div class="col-md-4 d-grid gap-2">
								<a class="btn btn-light" id="cancel" wicket:id="cancelEdit" data-testid="cancelEdit"><wicket:message key="commissionerEditBtnCanc" /></a>
								<button class="btn btn-primary" id="save" type="submit" wicket:id="edit" data-testid="edit">
									<wicket:message key="commissionerEditBtnSave" />
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
