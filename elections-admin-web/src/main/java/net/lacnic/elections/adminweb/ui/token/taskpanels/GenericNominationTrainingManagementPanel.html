<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div class="card mb-3">
			<div class="card-header">
				<h4 wicket:id="cardTitle" class="card-title" data-testid="cardTitle">
				<wicket:message key="acceptNominationTrainingTitle" />
			</h4>
		</div>
		<div class="card-body">
			<p wicket:id="restrictionMessage" data-testid="restrictionMessage"></p>

			<form wicket:id="trainingForm" data-testid="trainingForm">
				<p class="mb-2">
					<span class="fw-semibold">
						<wicket:message key="acceptNominationTrainingStatusLabel" />
					</span>
					<span wicket:id="statusValue" data-testid="statusValue"></span>
				</p>

				<div wicket:id="courseRequiredAlert" class="alert alert-warning mb-3" data-testid="courseRequiredAlert">
					<wicket:message key="acceptNominationTrainingCourseRequired" />
				</div>

				<p wicket:id="actionHint" class="mb-3" data-testid="actionHint"></p>
				<p wicket:id="actionLanguageHint" class="text-muted mb-3" data-testid="actionLanguageHint"></p>
				<p wicket:id="campusGuidanceLine2" class="text-muted mb-3" data-testid="campusGuidanceLine2"></p>
				<p wicket:id="campusGuidanceLine3" class="text-muted mb-3" data-testid="campusGuidanceLine3"></p>

				<p wicket:id="completedMessageTitle" class="fw-semibold mb-1" data-testid="completedMessageTitle"></p>
				<p wicket:id="completedMessageBody" class="text-muted mb-3" data-testid="completedMessageBody"></p>
				<div wicket:id="notApplicableAlert" class="alert alert-light mb-3" data-testid="notApplicableAlert">
					<wicket:message key="acceptNominationTrainingNotApplicableMessage" />
				</div>

				<div class="d-flex justify-content-end gap-2">
					<a wicket:id="backButton" class="btn btn-outline-light btn-md" data-testid="backButton"><wicket:message key="volver" /></a>
					<button wicket:id="checkCourseStatusButton" class="btn btn-primary btn-md" type="submit" data-testid="checkCourseStatusButton">
						<wicket:message key="acceptNominationTrainingCheckStatusButton" />
					</button>
					<button wicket:id="sendCredentialsButton" class="btn btn-primary btn-md" type="submit" data-testid="sendCredentialsButton">
						<span wicket:id="sendCredentialsButtonLabel" data-testid="sendCredentialsButtonLabel"></span>
					</button>
					<button wicket:id="sendCredentialsEnglishButton" class="btn btn-primary btn-md" type="submit" data-testid="sendCredentialsEnglishButton">
						<wicket:message key="acceptNominationTrainingEnrollEnglishButton" />
					</button>
					<button wicket:id="sendCredentialsPortugueseButton" class="btn btn-primary btn-md" type="submit" data-testid="sendCredentialsPortugueseButton">
						<wicket:message key="acceptNominationTrainingEnrollPortugueseButton" />
					</button>
				</div>
			</form>
		</div>
	</div>
</wicket:panel>
