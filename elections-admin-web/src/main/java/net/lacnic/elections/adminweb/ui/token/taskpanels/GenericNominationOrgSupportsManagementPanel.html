<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div class="card mb-3">
			<div class="card-header">
				<h4 wicket:id="cardTitle" class="card-title" data-testid="cardTitle">
				<wicket:message key="acceptNominationOrgSupportsTitle" />
			</h4>
		</div>
		<div class="card-body">
			<p wicket:id="restrictionMessage" data-testid="restrictionMessage"></p>

			<form wicket:id="orgSupportsForm" data-testid="orgSupportsForm">
				<label wicket:id="requiredSupportsHint" class="form-label d-block text-muted mb-1" data-testid="requiredSupportsHint"></label>
				<p wicket:id="progressHint" class="text-muted mb-3" data-testid="progressHint"></p>

				<div wicket:id="searchContainer" data-testid="searchContainer">
					<div class="mb-2">
						<label class="form-label">
							<wicket:message key="acceptNominationOrgSupportsIdentifierLabel" />
						</label>
						<div class="row g-2 align-items-center">
							<div class="col-md-3">
								<select wicket:id="identifierType" class="form-select" data-testid="identifierType"></select>
							</div>
							<div class="col-md-6">
								<input wicket:id="identifierValue" type="text" class="form-control"
									wicket:message="placeholder:acceptNominationOrgSupportsIdentifierValuePlaceholder" data-testid="identifierValue">
							</div>
							<div class="col-md-3 d-grid">
								<button wicket:id="searchOrganizationButton" class="btn btn-primary" type="submit" data-testid="searchOrganizationButton">
									<wicket:message key="acceptNominationOrgSupportsSearchButton" />
								</button>
							</div>
						</div>
						<p class="text-muted mb-0 mt-2">
							<wicket:message key="acceptNominationOrgSupportsSearchHint" />
						</p>
					</div>

					<div wicket:id="foundOrganizationContainer" class="border rounded-3 p-3 bg-light-subtle mb-4" data-testid="foundOrganizationContainer">
						<div class="d-flex flex-wrap gap-3">
							<div class="flex-grow-1">
								<p class="text-muted mb-1">
									<wicket:message key="acceptNominationOrgSupportsOrganizationNameLabel" />
								</p>
								<p class="mb-0 fw-semibold" wicket:id="foundOrganizationName" data-testid="foundOrganizationName"></p>
							</div>
							<div>
								<p class="text-muted mb-1">
									<wicket:message key="acceptNominationOrgSupportsOrganizationCountryLabel" />
								</p>
								<p class="mb-0 fw-semibold" wicket:id="foundOrganizationCountry" data-testid="foundOrganizationCountry"></p>
							</div>
						</div>
						<div class="mt-3">
							<p class="text-muted mb-1">
								<wicket:message key="acceptNominationOrgSupportsMembershipContactLabel" />
							</p>
							<p class="mb-0 fw-semibold" wicket:id="foundOrganizationContact" data-testid="foundOrganizationContact"></p>
						</div>
					</div>

					<div wicket:id="membershipContactConflictAlert" class="alert alert-warning mb-3" data-testid="membershipContactConflictAlert">
						<span wicket:id="membershipContactConflictMessage" data-testid="membershipContactConflictMessage"></span>
					</div>

					<div wicket:id="sendRequestActionContainer" class="d-flex justify-content-end mb-3" data-testid="sendRequestActionContainer">
						<button wicket:id="sendSupportRequestButton" class="btn btn-success btn-sm" type="submit" data-testid="sendSupportRequestButton">
							<wicket:message key="acceptNominationOrgSupportsSendRequestButton" />
						</button>
					</div>
				</div>

				<div wicket:id="waitingAlert" class="alert alert-light mb-3" data-testid="waitingAlert">
					<wicket:message key="acceptNominationOrgSupportsWaitingAlert" />
				</div>

				<p wicket:id="noSupportsLabel" class="text-muted mb-3" data-testid="noSupportsLabel"></p>

				<div class="table-responsive">
					<table class="table table-hover align-middle mb-0">
						<thead class="bg-light align-middle bg-opacity-25 thead-sm">
							<tr class="text-uppercase fs-xxs">
								<th>
									<wicket:message key="acceptNominationOrgSupportsTableOrganization" />
								</th>
								<th>
									<wicket:message key="acceptNominationOrgSupportsTableCountry" />
								</th>
								<th>
									<wicket:message key="acceptNominationOrgSupportsTableContact" />
								</th>
								<th>
									<wicket:message key="acceptNominationOrgSupportsTableStatus" />
								</th>
							</tr>
						</thead>
						<tbody>
							<tr wicket:id="supportRows" data-testid="supportRows">
								<td wicket:id="supportOrganizationLabel" data-testid="supportOrganizationLabel"></td>
								<td wicket:id="supportCountryLabel" data-testid="supportCountryLabel"></td>
								<td wicket:id="supportContactLabel" data-testid="supportContactLabel"></td>
								<td>
									<span wicket:id="supportStatusLabel" data-testid="supportStatusLabel"></span>
								</td>
							</tr>
						</tbody>
					</table>
				</div>

				<div class="d-flex mt-4 justify-content-end gap-2">
					<a wicket:id="backButton" class="btn btn-outline-light btn-md" data-testid="backButton">
						<wicket:message key="volver" />
					</a>
					<button wicket:id="continueLaterButton" class="btn btn-outline-light btn-md" type="submit" data-testid="continueLaterButton">
						<wicket:message key="candidateProfileContinueLaterButton" />
					</button>
				</div>
			</form>
		</div>
	</div>
</wicket:panel>
