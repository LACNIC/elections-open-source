<wicket:extend>
	<div class="row">
		<div wicket:id="feedback" data-testid="feedback"></div>
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 class="card-title mb-0" data-testid="auditorManagementTitle"><wicket:message key="auditorManagementTitle">Gestión de auditores</wicket:message></h5>
				</div>
				<div class="card-body">
					<div class="ins-wizard">
						<div wicket:id="tabsPanel" data-testid="tabsPanel"></div>
						<div class="tab-content pt-3">
							<div class="tab-pane fade show active">
								<div class="row g-3">
									<div wicket:id="addAuditorPanel" data-testid="addAuditorPanel"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 class="card-title mb-0" data-testid="auditorManagementSubtitle"><wicket:message key="auditorManagementSubtitle">Auditores</wicket:message></h5>
				</div>
				<div class="card-body">
					<div wicket:id="auditorsListPanel" data-testid="auditorsListPanel"></div>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
