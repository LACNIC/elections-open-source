<wicket:panel>
	<div class="d-flex justify-content-end align-items-center gap-3 flex-wrap">
		<div class="d-flex align-items-center gap-2">
			<span class="text-muted small mb-0" wicket:id="randomOrderLabel" data-testid="randomOrderLabel"></span>
			<div wicket:id="randomOrder" data-testid="randomOrder"></div>
		</div>
		<a wicket:id="addAbstention" class="btn btn-primary btn-sm" data-testid="add-abstention-link"><wicket:message key="candidateManagementAddAbstention" /></a>
		<a wicket:id="addNewCandidate" class="btn btn-primary btn-sm" data-testid="add-new-candidate-link"><wicket:message key="candidateManagementAddNewCandidate" /></a>
	</div>
</wicket:panel>
