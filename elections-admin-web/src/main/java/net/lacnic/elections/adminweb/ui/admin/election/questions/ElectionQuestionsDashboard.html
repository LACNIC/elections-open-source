<wicket:extend>
	<div class="row">
		<div wicket:id="feedback" data-testid="feedback"></div>
		<div wicket:id="questionEditContainer" class="col-lg-12">
			<div class="card float-e-margins">
				<div class="card-header">
					<h5 data-testid="candidateQuestionsManagementTitle">
						<wicket:message key="candidateQuestionsManagementTitle">Gestión de preguntas a candidatos</wicket:message>
						<span class="text-success" wicket:id="electionTitle" data-testid="electionTitle"></span>
					</h5>
				</div>
				<div class="card-body">
					<div wicket:id="questionEditPanel" data-testid="questionEditPanel"></div>
				</div>
			</div>
		</div>
		<div class="col-lg-12">
			<div class="card float-e-margins">
				<div class="card-header d-flex justify-content-between align-items-center gap-2">
					<h5 class="card-title mb-0" data-testid="candidateQuestionsManagementSubtitle"><wicket:message key="candidateQuestionsManagementSubtitle">Preguntas registradas en la elección</wicket:message></h5>
					<a wicket:id="newQuestion" data-testid="newQuestion" class="btn btn-primary btn-sm"><wicket:message key="candidateQuestionsNewButton" /></a>
				</div>
				<div class="card-body">
					<div wicket:id="questionsListPanel" data-testid="questionsListPanel"></div>
				</div>
			</div>
		</div>
		<div class="col-lg-12">
			<div class="text-center mt-2">
				<button wicket:id="back" data-testid="back" type="button" class="btn btn-light">
					<wicket:message key="confElecBtnBack" />
				</button>
			</div>
		</div>
	</div>
</wicket:extend>
