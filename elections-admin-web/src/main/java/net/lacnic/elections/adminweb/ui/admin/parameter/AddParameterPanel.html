<wicket:panel>
	<div class="row">
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 data-testid="advAddParamTitle"><wicket:message key="advAddParamTitle">Agregar parámetros</wicket:message></h5>
				</div>
				<div class="card-body">
					<form method="post" wicket:id="parameterForm" data-testid="parameterForm">
						<div class="row g-3 align-items-end">
							<div class="col-md-5">
								<input wicket:message="placeholder:advAddParamAddKey" id="key" class="form-control" wicket:id="key" data-testid="key">
							</div>
							<div class="col-md-5">
								<input wicket:message="placeholder:advAddParamAddValue" id="value" class="form-control" wicket:id="value" data-testid="value">
							</div>
							<div class="col-md-2 d-grid">
								<button class="btn btn-primary" id="add" type="submit" wicket:id="add" data-testid="add">
									<wicket:message key="advAddParamAddBtn" />
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
