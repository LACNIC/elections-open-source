<wicket:extend>
	<div class="row justify-content-center">
		<div wicket:id="feedback" data-testid="feedback"></div>
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 class="card-title mb-0" data-testid="gestion_eleccion"><wicket:message key="electionManagementTitle" /></h5>
				</div>
				<div class="card-body">
					<p class="text-muted mb-3"><wicket:message key="electionManagementDetail" /></p>
					<div class="ins-wizard">
						<div wicket:id="tabsPanel" data-testid="tabsPanel"></div>
						<div class="tab-content pt-3">
							<div class="tab-pane fade show active">
								<form id="form" wicket:id="newElectionForm" action="#" class="wizard-form" role="application" data-testid="newElectionForm">
									<div class="card">
										<div class="card-body">
											<div class="row g-3">
												<span wicket:id="fields" data-testid="fields"></span>
											</div>
										</div>
									</div>
									<div class="d-flex justify-content-between mt-4">
										<button wicket:id="cancel" type="button" id="cancel" class="btn btn-light" name="Cancel" data-testid="cancel">
											<wicket:message key="electionManagementCancel" />
										</button>
										<button wicket:id="submit" type="submit" id="save" class="btn btn-primary" name="Create" data-testid="submit">
											<wicket:message key="electionManagementSave" />
										</button>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
