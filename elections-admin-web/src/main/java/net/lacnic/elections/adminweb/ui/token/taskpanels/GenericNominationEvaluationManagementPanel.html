<wicket:panel xmlns:wicket="http://wicket.apache.org">
	<div class="card mb-3">
			<div class="card-header">
				<h4 wicket:id="cardTitle" class="card-title" data-testid="cardTitle">
				<wicket:message key="acceptNominationEvaluationTitle" />
			</h4>
		</div>
		<div class="card-body">
			<p wicket:id="restrictionMessage" data-testid="restrictionMessage"></p>

			<form wicket:id="trainingForm" data-testid="trainingForm">
				<p class="mb-2">
					<span class="fw-semibold">
						<wicket:message key="acceptNominationEvaluationStatusLabel" />
					</span>
					<span wicket:id="statusValue" data-testid="statusValue"></span>
				</p>

				<p wicket:id="evaluationRequiredAlert" class="text-muted mb-2" data-testid="evaluationRequiredAlert">
					<wicket:message key="acceptNominationEvaluationCourseRequired" />
				</p>

				<div wicket:id="actionHint" class="alert alert-warning mb-3" data-testid="actionHint"></div>
				<p wicket:id="supportContactHint" class="text-muted mb-3" data-testid="supportContactHint"></p>

				<div wicket:id="completedAlert" class="alert alert-success mb-3" data-testid="completedAlert">
					<wicket:message key="acceptNominationEvaluationCompletedMessage" />
				</div>
				<div wicket:id="notApplicableAlert" class="alert alert-light mb-3" data-testid="notApplicableAlert">
					<wicket:message key="acceptNominationEvaluationNotApplicableMessage" />
				</div>

				<div class="d-flex justify-content-end gap-2">
					<a wicket:id="backButton" class="btn btn-outline-light btn-md" data-testid="backButton"><wicket:message key="volver" /></a>
					<button wicket:id="checkEvaluationStatusButton" class="btn btn-primary btn-md" type="submit" data-testid="checkEvaluationStatusButton">
						<wicket:message key="acceptNominationEvaluationCheckStatusButton" />
					</button>
					<button wicket:id="sendCredentialsButton" class="btn btn-primary btn-md" type="submit" data-testid="sendCredentialsButton">
						<span wicket:id="sendCredentialsButtonLabel" data-testid="sendCredentialsButtonLabel"></span>
					</button>
				</div>
			</form>
		</div>
	</div>
</wicket:panel>
