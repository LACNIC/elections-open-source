<wicket:extend>
	<div class="row">
		<div wicket:id="feedback" data-testid="feedback" class="col-md-12"></div>
		<div class="col-lg-12">
			<div class="card float-e-margins">
				<div class="card-header">
					<h5 data-testid="sendMail2Title"><wicket:message key="sendMail2Title">Seleccionar Destinatarios</wicket:message></h5>
				</div>
				<div class="card-body">
					<p><wicket:message key="sendMail2Select" /></p>
					<form wicket:id="form" data-testid="form" class="form-horizontal p-w-md">
							<wicket:container wicket:id="recipients" data-testid="recipients">
								<div wicket:id="recipientTypes" data-testid="recipientTypes" class="p-xs mb-2">
									<label class="d-flex gap-2 align-items-start mb-0">
										<input wicket:id="recipientTypesRadio" data-testid="recipientTypesRadio" type="radio" name="ticker" class="mt-1" />
										<span>
											<span class="font-bold" wicket:id="label" data-testid="label"></span>
											<small class="d-block text-muted" wicket:id="description" data-testid="description"></small>
										</span>
									</label>
								</div>
							</wicket:container>
						<br>
						<div class="hr-line-dashed"></div>
						<div class="text-center">
							<button class="btn btn-light" wicket:id="cancel" data-testid="cancel" name="cancel"><wicket:message key="sendMail2BtnCanc" /></button>
							<button wicket:id="next" data-testid="next" type="submit" class="btn btn-w-m btn-primary" name="next"><wicket:message key="sendMail1BtnNext" /></button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
