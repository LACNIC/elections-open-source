<wicket:panel>
	<style>
		.candidate-cell-content {
			font-size: 0.92rem;
			line-height: 1.35;
		}
	</style>
	<div wicket:id="abstentionContainer" data-testid="abstentionContainer" class="table-responsive mb-4">
	<table class="table table-hover align-middle mb-0 border border-warning-subtle">
		<tbody>
			<tr>
				<td class="text-center"><div wicket:id="removeAbstention" data-testid="removeAbstention"></div></td>
				<td class="text-center">
					<img alt="image" class="rounded-circle candidate-photo-sepia" width="72" height="72" wicket:id="abstentionPicture" data-testid="abstentionPicture">
					<div class="mt-2">
						<span class="badge text-bg-warning"><wicket:message key="candidateManagementAbstentionTitle" /></span>
					</div>
					<div class="mt-1">
						<span class="badge text-bg-info" wicket:id="abstentionPosition" data-testid="abstentionPosition"></span>
					</div>
				</td>
				<td>
					<strong wicket:id="abstentionName" data-testid="abstentionName"></strong>
					<div class="mt-2 mb-2 candidate-cell-content">
						<div><strong>ID:</strong> <span wicket:id="abstentionCandidateId" data-testid="abstentionCandidateId"></span></div>
						<div class="mt-2">
							<strong><wicket:message key="candidateManagementBioLabel" />:</strong>
							<div wicket:id="abstentionBioSpanish" data-testid="abstentionBioSpanish"></div>
						</div>
						<div class="mt-2">
							<div><strong><wicket:message key="candidateManagemenProgressColCandidateStatus" />:</strong> <span wicket:id="abstentionCandidateStatus" data-testid="abstentionCandidateStatus"></span></div>
						</div>
					</div>
				</td>
				<td>
					<div class="d-grid gap-2">
						<a wicket:id="changeAbstentionPhoto" class="btn btn-light btn-sm" data-testid="changeAbstentionPhoto"><wicket:message key="candidateManagemenListChangePhoto" /></a>
						<a wicket:id="styleAbstentionBiography" class="btn btn-light btn-sm" data-testid="styleAbstentionBiography"><wicket:message key="candidateManagemenListStyleBiography" /></a>
						<a wicket:id="fixAbstentionTop" class="btn btn-light btn-sm" data-testid="fixAbstentionTop"><wicket:message key="candidateManagemenListFirst" /></a>
						<a wicket:id="fixAbstentionBottom" class="btn btn-light btn-sm" data-testid="fixAbstentionBottom"><wicket:message key="candidateManagemenListLast" /></a>
					</div>
				</td>
			</tr>
		</tbody>
	</table>
	</div>
	<div class="table-responsive">
	<table class="table table-hover align-middle mb-0">
		<thead class="table-light">
			<tr>
				<th><wicket:message key="candidateManagemenListDel" /></th>
				<th class="text-center"><wicket:message key="candidateManagemenListPicl" /></th>
				<th><wicket:message key="candidateManagemenListNomination" /></th>
				<th><wicket:message key="candidateManagemenListName" /></th>
				<th></th>
				<th><wicket:message key="candidateManagemenListActions" /></th>
			</tr>
		</thead>
		<tbody>
			<tr wicket:id="candidatesList" data-testid="candidatesList">
				<td class="text-center"><div wicket:id="removeCandidate" data-testid="removeCandidate"></div></td>
				<td wicket:id="pictureCell" class="text-center">
					<img alt="image" class="rounded-circle candidate-photo-sepia" width="72" height="72" wicket:id="picture" data-testid="picture">
					<div class="mt-2">
						<span class="badge text-bg-info" wicket:id="sortStatus" data-testid="sortStatus"></span>
					</div>
					<div>
						<a wicket:id="removeFixed" data-testid="removeFixed"><i class="ti ti-x text-danger fs-28"></i></a>
					</div>
				</td>
				<td>
					<div class="mt-2 mb-2 candidate-cell-content" wicket:id="nominationSummary" data-testid="nominationSummary"></div>
				</td>
				<td>
					<strong wicket:id="name" data-testid="name"></strong>
					<span wicket:id="winnerBadge" data-testid="winnerBadge" class="badge text-bg-warning ms-2"><wicket:message key="candidateManagementWinnerBadge" /></span>
					<div class="mt-2 mb-2 candidate-cell-content">
						<div><strong>ID:</strong> <span wicket:id="candidateId" data-testid="candidateId"></span></div>
						<div><strong><wicket:message key="candidateManagementMail" />:</strong> <span wicket:id="mail" data-testid="mail"></span></div>
						<div class="mt-2">
							<strong>Biografía:</strong>
							<div wicket:id="bioSpanish" data-testid="bioSpanish"></div>
						</div>
						<div><strong><wicket:message key="candidateManagementLinkedin" />:</strong> <a wicket:id="linkedinLink" data-testid="linkedinLink" target="_blank" rel="noopener noreferrer"><span wicket:id="linkedinLinkText" data-testid="linkedinLinkText"></span></a><span wicket:id="linkedinLinkEmpty" data-testid="linkedinLinkEmpty"></span></div>
						<div class="mt-2">
							<div><strong><wicket:message key="candidateManagemenProgressColCandidateStatus" />:</strong> <span wicket:id="candidateStatus" data-testid="candidateStatus"></span></div>
							<div><strong><wicket:message key="candidateManagemenListCampusStatus" />:</strong> <span wicket:id="campusStatus" data-testid="campusStatus"></span></div>
						</div>
					</div>
				</td>
				<td>
					<a wicket:id="fixTop" data-testid="fixTop"><i class="ti ti-chevrons-up fs-2 text-danger" wicket:message="title:candidateManagemenListFirst"></i></a>
					<a wicket:id="moveUp" data-testid="moveUp"><i class="ti ti-chevron-up fs-2"></i></a>
					<a wicket:id="moveDown" data-testid="moveDown"><i class="ti ti-chevron-down fs-2"></i></a>
					<a wicket:id="fixBottom" data-testid="fixBottom"><i class="ti ti-chevrons-down fs-2 text-danger" wicket:message="title:candidateManagemenListLast"></i></a>
				</td>
				<td>
					<div class="d-grid gap-2">
						<a wicket:id="manageStatus" data-testid="manageStatus" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListManageStatus" /></a>
						<a wicket:id="manageSupports" data-testid="manageSupports" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListManageSupports" /></a>
						<a wicket:id="manageTraining" data-testid="manageTraining" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListManageTraining" /></a>
						<a wicket:id="viewAnswers" data-testid="viewAnswers" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListViewAnswers" /></a>
						<a wicket:id="changePhoto" data-testid="changePhoto" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListChangePhoto" /></a>
						<a wicket:id="styleBiography" data-testid="styleBiography" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListStyleBiography" /></a>
						<a wicket:id="manageTranslations" data-testid="manageTranslations" class="btn btn-light btn-sm"><wicket:message key="candidateManagemenListManageTranslations" /></a>
						<a wicket:id="markWinner" data-testid="markWinner" class="btn btn-warning btn-sm"><wicket:message key="candidateManagementMarkWinner" /></a>
						<a wicket:id="unmarkWinner" data-testid="unmarkWinner" class="btn btn-outline-warning btn-sm"><wicket:message key="candidateManagementUnmarkWinner" /></a>
					</div>
				</td>
			</tr>
		</tbody>
	</table>
	</div>
</wicket:panel>
