<wicket:panel>
	<div class="row">
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 data-testid="advDisIPTitle"><wicket:message key="advDisIPTitle">Listado de Ips inválidas</wicket:message></h5>
				</div>
				<div class="card-body">
					<div class="table-responsive">
						<table class="table table-hover align-middle mb-0 dataTables">
							<thead class="table-light">
								<tr>
									<th><wicket:message key="advDisIPIP" /></th>
									<th><wicket:message key="advDisIPTries" /></th>
									<th><wicket:message key="advDisIPFirstTry" /></th>
									<th><wicket:message key="advDisIPLastTry" /></th>
								</tr>
							</thead>
							<tbody>
								<tr wicket:id="ipAccessList" data-testid="ipAccessList">
									<td wicket:id="ip" data-testid="ip"></td>
									<td wicket:id="attemptCount" data-testid="attemptCount"></td>
									<td wicket:id="firstAttemptDate" data-testid="firstAttemptDate"></td>
									<td wicket:id="lastAttemptDate" data-testid="lastAttemptDate"></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
