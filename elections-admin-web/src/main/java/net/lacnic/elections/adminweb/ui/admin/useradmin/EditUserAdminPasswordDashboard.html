<wicket:extend>
	<div wicket:id="feedback" data-testid="feedback"></div>
	<div class="row">
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 data-testid="adminUserEditTitle"><wicket:message key="adminUserEditTitle">Cambiar contraseña de un administrador</wicket:message></h5>
				</div>
				<div class="card-body">
					<form wicket:id="passwordForm" data-testid="passwordForm">
						<div class="row g-3 align-items-end">
							<div class="col-md-3">
								<label class="form-label"><wicket:message key="adminUserEditNuPwd" /></label>
								<input type="password" id="newPassword1" class="form-control" wicket:id="newPassword1" data-testid="newPassword1" />
							</div>
							<div class="col-md-3">
								<label class="form-label"><wicket:message key="adminUserEditNuPwdRep" /></label>
								<input type="password" id="newPassword2" class="form-control" wicket:id="newPassword2" data-testid="newPassword2" />
							</div>
							<div class="col-md-3 d-grid gap-2">
								<button class="btn btn-light" id="cancelEdit" wicket:id="cancelEdit" data-testid="cancelEdit" type="button">
									<wicket:message key="adminUserEditBtnCanc" />
								</button>
								<button class="btn btn-primary" id="save" type="submit" wicket:id="save" data-testid="save">
									<wicket:message key="adminUserEditBtnSave" />
								</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
