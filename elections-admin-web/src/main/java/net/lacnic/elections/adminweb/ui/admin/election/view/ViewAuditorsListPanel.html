<wicket:panel>
	<form wicket:id="form" data-testid="form">
		<div wicket:id="auditorsListContainer" data-testid="auditorsListContainer">
			<div class="table-responsive m-t">
				<table class="table dataTables">
					<thead class="jumbotron">
						<tr>
							<th><wicket:message key="auditorsListName" /></th>
							<th><wicket:message key="auditorsListMail" /></th>
							<th><wicket:message key="auditorsListConf" /></th>
							<th><wicket:message key="auditorsListLink" /></th>
						</tr>
					</thead>
					<tbody>
						<tr wicket:id="auditorsList" data-testid="auditorsList">
							<td wicket:id="name" data-testid="name"></td>
							<td wicket:id="email" data-testid="email"></td>
							<td wicket:id="agreedConformity" data-testid="agreedConformity"></td>
							<td><wicket:message key="linkNotAvailable" /></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</form>
</wicket:panel>
