<wicket:panel>
	<div class="card">
		<div class="card-header">
			<h5 data-testid="mensajes">Mensajes</h5>
		</div>
		<div class="card-body">
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0 dataTables1">
					<thead class="table-light">
						<tr>
							<th class="text-left"><wicket:message key="messageListState" /></th>
							<th class="text-left"><wicket:message key="messageListDest" /></th>
							<th class="text-left"><wicket:message key="messageListType" /></th>
							<th class="text-left"><wicket:message key="messageListSubject" /></th>
							<th class="text-left"><wicket:message key="messageListBody" /></th>
						</tr>
					</thead>
					<tbody>
						<tr wicket:id="emailsList" data-testid="emailsList" name="emailsList">
							<td class="text-left"><span wicket:id="sent" data-testid="sent"></span></td>
							<td class="text-left"><span wicket:id="recipients" data-testid="recipients"></span></td>
							<td class="text-left"><span wicket:id="templateType" data-testid="templateType"></span></td>
							<td class="text-left"><span wicket:id="subject" data-testid="subject"></span></td>
							<td class="text-left"><span wicket:id="body" data-testid="body"></span></td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
	<script>
		$(document).ready(function() {
			$('.dataTables1').dataTable({
				"order" : [ [ 4, "desc" ] ],
				"dom" : '<"top"f>rt<"bottom"p><"clear">',
				"language" : {
					"sSearch" : "Filter:",
					"oPaginate" : {
						"sNext" : ">",
						"sPrevious" : "<"
					}
				}
			});

		});
	</script>
</wicket:panel>
