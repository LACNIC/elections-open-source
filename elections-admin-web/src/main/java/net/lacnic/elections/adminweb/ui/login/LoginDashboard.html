<wicket:extend>

				<h4 class="fw-bold mt-3" wicket:id="loginTitle" data-testid="loginTitle">Ingreso al sistema</h4>
				<p class="text-muted w-lg-75 mx-auto"><wicket:message key="adminPanel" /></p>
			</div>

			<div class="card p-4 rounded-4">

					<div wicket:id="logoPanel" data-testid="logoPanel"></div>

		</div>
	</div>
</wicket:extend>
