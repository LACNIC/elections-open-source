<wicket:panel>
	<div class="row">
		<div class="col-lg-12">
			<div class="card">
				<div class="card-header">
					<h5 data-testid="advParameterTitle"><wicket:message key="advParameterTitle">Listado de parametros del sistema</wicket:message></h5>
				</div>
				<div class="card-body">
					<div class="table-responsive">
						<table id="parametersTable" data-testid="parametersTable" class="table table-hover align-middle mb-0 dataTables">
							<thead class="table-light">
								<tr>
									<th></th>
									<th><wicket:message key="advParameterKey" /></th>
									<th><wicket:message key="advParameterValue" /></th>
									<th><wicket:message key="advParameterEdit" /></th>
								</tr>
							</thead>
							<tbody>
								<tr wicket:id="parametersList" data-testid="parametersList">
									<td><span wicket:id="remove" data-testid="remove"></span></td>
									<td wicket:id="key" data-testid="key"></td>
									<td wicket:id="value" data-testid="value"></td>
										<td><a wicket:id="editParameter" data-testid="editParameter" class="text-primary ti ti-pencil fs-28 m-r-sm" wicket:message="aria-label:advParameterEdit"></a></td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
