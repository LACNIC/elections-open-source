<wicket:panel>
	<div class="card float-e-margins">
		<div class="card-header">
			<h5 data-testid="electionDetailTitle"><wicket:message key="electionDetailTitle">Detalle elección</wicket:message></h5>
		</div>
		<div class="card-body">
			<div class="row">
				<div class="col-lg-12 m-b-sm">
					<b wicket:id="title" data-testid="title" id="electionTitle"></b>
				</div>
				<div class="col-lg-12">
					<p id="electionDescription" wicket:id="description" data-testid="description"></p>
				</div>
				<div class="col-lg-12 hr-line-dashed"></div>
				<div class="col-lg-12">
					<div class="d-flex flex-wrap align-items-center gap-2">
						<span>
							<strong><wicket:message key="voterLabel" /></strong>&nbsp;<span wicket:id="voter" data-testid="voter"></span>
						</span>
						<span class="text-muted">|</span>
						<span>
							<strong><wicket:message key="maxCandidatesLabel" /></strong>&nbsp;<span wicket:id="maxCandidates" data-testid="maxCandidates"></span>
						</span>
						<span class="text-muted">|</span>
						<span>
							<strong><wicket:message key="voteAmountLabel" /></strong>&nbsp;<span wicket:id="voteAmount" data-testid="voteAmount"></span>
						</span>
					</div>
					<div class="mt-2 text-muted" wicket:id="complementaryInfoContainer" data-testid="complementaryInfoContainer">
						<small>
							<strong><wicket:message key="complementaryInfoLabel" /></strong>&nbsp;<span wicket:id="complementaryInfo" data-testid="complementaryInfo"></span>
						</small>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:panel>
