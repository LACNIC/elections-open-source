<wicket:extend xmlns:wicket="http://wicket.apache.org">
	<div class="row mt-3">
		<div wicket:id="feedbackPanel" data-testid="feedbackPanel"></div>
		<div class="col-12" wicket:id="noRevision" data-testid="noRevision">
			<div class="row">
				<div wicket:id="auditorAgreeConformityPanel" data-testid="auditorAgreeConformityPanel"></div>
				<div class="col-lg-6">
					<div class="card float-e-margins">
						<div class="card-header">
							<h5 data-testid="auditElectionResults"><wicket:message key="auditElectionResults">Resultado de la elección</wicket:message></h5>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-lg-12" id="electionDescription" data-testid="electionDescription">
									<strong wicket:id="title" data-testid="title" id="electionTitle"></strong>
									<p wicket:id="description" data-testid="description"></p>
								</div>
								<div class="col-lg-12" wicket:id="resultsPanel" data-testid="resultsPanel"></div>
							</div>
						</div>
					</div>
				</div>
				<div class="col-lg-6">
					<div class="card float-e-margins">
						<div class="card-header">
							<h5 data-testid="auditPanel"><wicket:message key="auditPanel">Panel de auditoría</wicket:message></h5>
						</div>
						<div class="card-body">
							<div class="row">
								<div class="col-lg-12">
									<p><wicket:message key="commissionersInformationText" /></p>
									<div wicket:id="moreInformationForAuditPanel" data-testid="moreInformationForAuditPanel"></div>
								</div>
								<div class="col-lg-12">
									<p><wicket:message key="codesListText" /></p>
									<div wicket:id="candidateCodesPanel" data-testid="candidateCodesPanel"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
</wicket:extend>
